services:
  # Backend Express API Service
  - type: web
    name: hotel-management-backend
    runtime: node
    plan: free
    rootDir: hotel-management-backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hotel-db
          property: connectionString

  # Frontend React (Vite) Static Site
  - type: web
    name: hotel-management-frontend
    runtime: static
    rootDir: hotel-management-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: hotel-management-backend
          property: host

databases:
  # Managed PostgreSQL Database
  - name: hotel-db
    databaseName: hotel_management_db
    user: hotel_admin
    plan: free
